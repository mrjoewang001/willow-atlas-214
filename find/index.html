  :root {
    --ink-navy: #181c3a;
    --dusk-plum: #3c2a58;
    --horizon-coral: #ff9169;
    --coral-deep: #b8502f;
    --plum-deep: #4a3569;
    --gold: #e8c583;
    --gold-soft: #cba966;
    --page-ivory: #fbf3e3;
    --ink-plum: #2e2440;
    --ink-plum-soft: #5b4d6e;

    --font-display: 'Cormorant Invite', 'Songti TC', 'PMingLiU', serif;
    --font-cjk-serif: 'Songti TC', 'PMingLiU', 'Noto Serif TC', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Heiti TC',
      'Microsoft JhengHei', sans-serif;

    --content-w: 480px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    background: linear-gradient(180deg, var(--ink-navy) 0%, var(--dusk-plum) 60%, #5a3a52 100%);
    color: var(--page-ivory);
    font-family: var(--font-body);
    overflow-x: hidden;
    line-height: 1.6;
    position: relative;
  }

  canvas.stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: var(--content-w);
    margin: 0 auto;
    padding: 3rem 1.6rem 3rem;
  }

  .eyebrow {
    display: block;
    text-align: center;
    font-family: var(--font-cjk-serif);
    font-size: 0.86rem;
    letter-spacing: 0.32em;
    padding-left: 0.32em;
    color: var(--gold);
    margin-bottom: 0.8rem;
  }

  h1 {
    text-align: center;
    font-family: var(--font-cjk-serif);
    font-weight: 700;
    font-size: clamp(1.8rem, 8vw, 2.3rem);
    margin: 0 0 0.6rem;
    background: linear-gradient(180deg, #fff6e6, var(--gold) 70%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    text-align: center;
    font-size: 1.08rem;
    color: #f1e7d8;
    margin: 0 0 2rem;
  }

  .card {
    background: #fffdf8;
    border-radius: 20px;
    padding: 1.8rem 1.6rem;
    box-shadow: 0 20px 50px -18px rgba(0, 0, 0, 0.6);
  }

  form { display: flex; flex-direction: column; gap: 1rem; }

  label {
    font-size: 0.96rem;
    font-weight: 600;
    color: var(--ink-plum-soft);
    text-align: center;
  }

  input[type="tel"] {
    font-family: var(--font-display);
    font-size: 1.9rem;
    letter-spacing: 0.3em;
    text-align: center;
    padding: 0.7em 0.4em 0.6em;
    border: 2px solid #e5d3ad;
    border-radius: 12px;
    background: #fffaf0;
    color: var(--ink-plum);
    font-variant-numeric: tabular-nums;
    width: 100%;
  }
  input[type="tel"]:focus {
    outline: none;
    border-color: var(--coral-deep);
  }
  input[type="tel"]::placeholder {
    color: #d8c6a3;
    letter-spacing: 0.08em;
    font-family: var(--font-body);
    font-size: 1.05rem;
  }

  button.go {
    font-family: var(--font-body);
    font-size: 1.08rem;
    font-weight: 700;
    background: var(--horizon-coral);
    color: #2b1a17;
    border: none;
    border-radius: 999px;
    padding: 0.95em 1.5em;
    min-height: 52px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  button.go:active:not(:disabled) { transform: scale(0.97); }
  button.go:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  :focus-visible { outline: 2px solid var(--coral-deep); outline-offset: 3px; }

  .inline-hint {
    text-align: center;
    font-size: 0.92rem;
    color: var(--coral-deep);
    margin: -0.2rem 0 0;
    min-height: 1.3em;
  }

  /* ---------- Result card ---------- */

  .result {
    margin-top: 1.6rem;
    display: none;
  }
  .result.show { display: block; }

  .ticket {
    border: 1px solid #ecdcb8;
    border-radius: 16px;
    padding: 1.7rem 1.4rem 1.5rem;
    text-align: center;
    background: linear-gradient(160deg, #fffaf0, #f2e0b3);
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .ticket.in { opacity: 1; transform: translateY(0) scale(1); }

  .ticket .eyebrow-label {
    display: block;
    font-family: var(--font-body);
    font-size: 0.86rem;
    letter-spacing: 0.15em;
    color: var(--ink-plum-soft);
    margin-bottom: 0.5rem;
  }

  .ticket .table-num {
    font-family: var(--font-cjk-serif);
    font-weight: 700;
    font-size: clamp(2.1rem, 12vw, 2.7rem);
    line-height: 1.1;
    color: var(--coral-deep);
  }
  .ticket.groom .table-num { color: var(--plum-deep); }
  .ticket.head .table-num { color: #8a6a1f; }

  .ticket .theme-label {
    display: block;
    font-size: 0.86rem;
    letter-spacing: 0.1em;
    color: var(--ink-plum-soft);
    margin: 1.1rem 0 0.3rem;
  }
  .ticket .theme-name {
    font-family: var(--font-cjk-serif);
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--ink-plum);
  }

  .ticket .find-note {
    margin-top: 1.2rem;
    padding-top: 1rem;
    border-top: 1px dashed #e0cda0;
    font-size: 1rem;
    color: var(--ink-plum);
  }
  .ticket .find-note b { color: var(--coral-deep); }
  .ticket.groom .find-note b { color: var(--plum-deep); }

  .retry-btn {
    display: block;
    margin: 1.1rem auto 0;
    background: none;
    border: none;
    font-family: var(--font-body);
    font-size: 0.98rem;
    color: var(--ink-plum-soft);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 0.6em 1em;
    min-height: 44px;
  }

  /* ---------- Not-found / multi-match messages ---------- */

  .msg-box {
    text-align: center;
    padding: 1.3rem 1.1rem;
    color: var(--ink-plum-soft);
    font-size: 1rem;
    line-height: 1.85;
    background: #fbf3e0;
    border: 1px solid #ecdcb8;
    border-radius: 14px;
  }
  .msg-box strong {
    display: block;
    color: var(--coral-deep);
    font-size: 1.15rem;
    margin-bottom: 0.5rem;
  }
  .msg-box a { color: var(--coral-deep); font-weight: 600; }
  .msg-box .msg-body {
    text-wrap: balance;
    margin: 0 0 0.7rem;
  }
  .msg-box .msg-body:last-child { margin-bottom: 0; }

  .not-found {
    text-align: center;
    padding: 1.2rem 1rem;
    color: var(--ink-plum-soft);
    font-size: 0.98rem;
    line-height: 1.8;
  }
  .not-found strong { display: block; color: var(--ink-plum); font-size: 1.08rem; margin-bottom: 0.3rem; }

  /* ---------- Castle table overview ---------- */

  .castle-section {
    margin-top: 2.4rem;
    display: none;
  }
  .castle-section.show { display: block; }

  .castle-section-title {
    text-align: center;
    font-family: var(--font-cjk-serif);
    font-weight: 700;
    font-size: clamp(1.5rem, 7vw, 1.9rem);
    letter-spacing: 0.06em;
    margin: 0 0 0.8rem;
    background: linear-gradient(180deg, #fff6e6, var(--gold) 70%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .castle-title {
    text-align: center;
    font-family: var(--font-cjk-serif);
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--page-ivory);
    margin: 0 0 0.7rem;
  }
  .castle-desc {
    text-align: center;
    font-size: 0.92rem;
    color: #ede0c8;
    max-width: 32em;
    margin: 0 auto 1rem;
    line-height: 1.75;
  }
  .castle-highlight-line {
    text-align: center;
    font-family: var(--font-cjk-serif);
    font-size: 0.98rem;
    color: #f1e7d8;
    margin: 0 0 1.3rem;
  }
  .castle-highlight-line b {
    color: var(--gold);
    font-weight: 700;
  }

  .stage-graphic {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    margin: 0 0 0.9rem;
  }
  .stage-graphic .stage-bar {
    width: 130px;
    height: 14px;
    border-radius: 4px;
    background: linear-gradient(90deg, transparent, var(--gold) 12%, #fff3d6 50%, var(--gold) 88%, transparent);
    box-shadow: 0 0 14px 2px rgba(232, 197, 131, 0.55);
  }
  .stage-graphic .stage-label {
    font-family: var(--font-cjk-serif);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.2em;
    padding-left: 0.2em;
    color: #fff3d6;
  }
  .stage-graphic .stage-arrow {
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 9px solid var(--gold-soft);
    opacity: 0.85;
  }

  .castle-head-wrap {
    display: flex;
    justify-content: center;
    margin: 0 0 1.5rem;
  }
  .castle-head-card {
    position: relative;
    width: 100%;
    max-width: 220px;
    background: #fffdf8;
    border: 1.5px solid var(--gold);
    border-radius: 14px;
    padding: 0.85rem 0.7rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
  }
  .castle-head-card .c-icon {
    width: 20px;
    height: 20px;
    color: var(--gold-soft);
    opacity: 0.9;
    margin-bottom: 0.1rem;
  }
  .castle-head-card .c-badge {
    font-family: var(--font-cjk-serif);
    font-weight: 700;
    font-size: 0.78rem;
    padding: 0.15em 0.7em;
    border-radius: 999px;
    background: rgba(232, 197, 131, 0.2);
    color: #8a6a1f;
  }
  .castle-head-card .c-cn {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--plum-deep);
  }
  .castle-head-card .c-en {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 0.72rem;
    color: var(--ink-plum-soft);
  }
  .castle-head-card .your-tag {
    display: none;
    position: absolute;
    top: -9px;
    right: -6px;
    font-size: 0.6rem;
    letter-spacing: 0.03em;
    font-weight: 700;
    color: #fff8ec;
    background: #a97f2c;
    padding: 0.22em 0.55em;
    border-radius: 999px;
    box-shadow: 0 3px 8px -2px rgba(203, 169, 102, 0.7);
    white-space: nowrap;
  }
  .castle-head-card.active {
    background: linear-gradient(160deg, #fffaf0, #f0d998);
    border-color: #a97f2c;
    border-width: 2px;
    box-shadow: 0 10px 22px -8px rgba(203, 169, 102, 0.7), 0 0 0 1.5px #a97f2c;
  }
  .castle-head-card.active .your-tag { display: block; }

  .castle-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.7rem;
  }

          castleHighlightLine.style.display = '';
          castleHighlightLine.innerHTML =
            '你所在的「<b>' + tableLabel(entry.t) + '</b>」，主題桌名是《<b>' + match.cn + '</b>》。';
        } else {
          castleHighlightLine.style.display = 'none';
          castleHighlightLine.innerHTML = '';
        }
      }

      castleSection.classList.add('show');
    }

    function hideCastle() {
      castleSection.classList.remove('show');
      castleHeadCard.classList.remove('active');
      document.querySelectorAll('.castle-card.active').forEach(function (el) {
        el.classList.remove('active');
      });
    }

    var phoneInput = document.getElementById('phone6');
    var goBtn = document.getElementById('goBtn');
    var inlineHint = document.getElementById('inlineHint');
    var resultEl = document.getElementById('result');

    // 1) digits only, 2) max 6 chars, 6) button enabled only at exactly 6 digits
    phoneInput.addEventListener('input', function () {
      var digits = phoneInput.value.replace(/\D/g, '').slice(0, 6);
      phoneInput.value = digits;
      goBtn.disabled = digits.length !== 6;
      inlineHint.textContent = '';
    });

    function showTicket(entry) {
      var t = document.createElement('div');
      t.className = 'ticket ' + sideClass(entry.s);
      var themeBlock = entry.th
        ? '<span class="theme-label">迪士尼主題桌名</span><div class="theme-name">' + entry.th + '</div>'
        : '';
      var findText = entry.th
        ? '婚宴當天請尋找「<b>' + tableLabel(entry.t) + '・' + entry.th + '</b>」桌牌'
        : '婚宴當天請尋找「<b>' + tableLabel(entry.t) + '</b>」桌牌';
      t.innerHTML =
        '<span class="eyebrow-label">您的桌次</span>' +
        '<div class="table-num">' + tableLabel(entry.t) + '</div>' +
        themeBlock +
        '<div class="find-note">' + findText + '</div>';
      resultEl.appendChild(t);
      setTimeout(function () { t.classList.add('in'); }, 40);

      var retry = document.createElement('button');
      retry.type = 'button';
      retry.className = 'retry-btn';
      retry.textContent = '重新查詢';
      retry.addEventListener('click', resetSearch);
      resultEl.appendChild(retry);

      renderCastle(entry);
    }

    function showMessage(strongText, bodyHtml) {
      var box = document.createElement('div');
      box.className = 'msg-box';
      box.innerHTML = '<strong>' + strongText + '</strong>' + bodyHtml;
      resultEl.appendChild(box);
      hideCastle();
    }

    function render(entries) {
      resultEl.innerHTML = '';
      resultEl.classList.add('show');

      if (!entries || entries.length === 0) {
        showMessage(
          '找不到符合的桌次',
          '<p class="msg-body">請確認輸入的是「回覆出席時所登記的手機末6碼」。</p>' +
          '<p class="msg-body">如果當時由親友代為回覆，請輸入該位聯絡人的手機末6碼。</p>' +
          '<p class="msg-body">仍然查不到嗎？歡迎透過 <a href="https://lin.ee/sb76LiR" target="_blank" rel="noopener">LINE</a> 聯絡我們協助確認。</p>'
        );
        return;
      }

      if (entries.length > 1) {
        showMessage(
          '有多筆符合資料',
          '<p class="msg-body">請透過 <a href="https://lin.ee/sb76LiR" target="_blank" rel="noopener">LINE</a> 聯絡我們協助確認。</p>'
        );
        return;
      }

      showTicket(entries[0]);
      resultEl.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
    }

    function resetSearch() {
      resultEl.classList.remove('show');
      resultEl.innerHTML = '';
      hideCastle();
      phoneInput.value = '';
      goBtn.disabled = true;
      inlineHint.textContent = '';
      phoneInput.focus();
    }

    document.getElementById('searchForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = phoneInput.value;
      if (v.length !== 6) {
        inlineHint.textContent = '請輸入完整的 6 位數字';
        return;
      }
      goBtn.disabled = true;
      goBtn.textContent = '查詢中…';
      setTimeout(function () {
        render(DATA[v]);
        goBtn.textContent = '查詢桌次';
        goBtn.disabled = v.length !== 6;
      }, 260);
    });

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (list) {
        list.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add('is-visible'); io.unobserve(en.target); }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('[data-reveal]').forEach(function (el) { io.observe(el); });
    } else {
      document.querySelectorAll('[data-reveal]').forEach(function (el) { el.classList.add('is-visible'); });
    }
  })();
</script>

</body>
</html>
